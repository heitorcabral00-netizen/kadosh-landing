<!DOCTYPE html>
<!--
  Página de cases — atende em /cases, sem .html à vista.

  Ela mora em cases/index.html de propósito: servidor de site estático entrega
  index.html quando pedem a pasta, então o endereço público fica /cases. É o
  jeito de ter URL limpa sem depender de configuração no painel do Render.

  Usa o mesmo /assets/estilo.css e o mesmo /assets/site.js da home: nada de
  estilo nem de comportamento é reescrito aqui, então as duas páginas não
  divergem. O script é defensivo — só mexe no que existe na página.
-->
<html lang="pt-BR">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cases — Kadosh</title>

<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="canonical" href="https://kadoshsistemas.com.br/cases">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Kadosh">
<meta property="og:locale" content="pt_BR">

<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#0B0B0C">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/estilo.css">

<body>
<script>document.documentElement.classList.add('anim')</script>

<header>
  <a class="logo" href="/"><span class="mark">k</span><span class="word">kadosh<i class="quad"></i></span></a>
  <nav>

<main>

       cadastrados no painel quando ele responde. Aqui entram todos os
       publicados; a home mostra a quantidade escolhida no painel. -->
  <div class="cases-grid" id="lista-cases"></div>

  <div style="margin-top:56px;display:flex;align-items:center;gap:16px;flex-wrap:wrap">
    <a class="btn btn-dark" href="/#contato">Falar com a equipe</a>
